<!DOCTYPE html>

<title>Riya Spa - 5 Step One Page</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#0a0a0a}
.main{max-width:430px;margin:auto;background:#fff;min-height:100vh}
.top{background:#111;color:#fff;padding:22px;text-align:center;border-radius:0 0 20px 20px}
.top h1{font-family:Playfair Display;letter-spacing:6px;font-size:26px}
.step{background:#D9FF66;color:#111;padding:5px 14px;border-radius:20px;font-size:11px;font-weight:900;display:inline-block;margin:18px 0 10px;letter-spacing:1px}
.opt{border:1.5px solid #eee;background:#f9f9f9;padding:14px;border-radius:14px;text-align:center;font-weight:800;cursor:pointer;font-size:13px}
.opt.active{background:#111;color:#fff;border-color:#111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.input{width:100%;padding:13px;border-radius:12px;border:1.5px solid #eee;background:#f8f8f8;outline:none;font-size:13px}
.box{background:#111;color:#fff;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center}

.hotel{width:100%;height:190px;object-fit:cover;border-radius:16px}
.pay-btn{padding:12px;border-radius:14px;text-align:center;font-weight:900;font-size:12px;cursor:pointer}
</style>
</head>
